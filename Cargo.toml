[package]
name = "lightning"
version = "0.8.2"
authors = ["LM"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "lightning"
harness = false

[dependencies]
# esp-idf-svc is deliberately not here yet. It links the WiFi and BLE stacks
# behind it, and §5's WiFi/SNTP is deferred -- so until there is a network to
# talk to, the radio stacks are pure binary size. esp-idf-hal re-exports the raw
# IDF bindings as `sys`, which is enough for NVS and the filesystem.
esp-idf-hal = "0.46"

# Stack-allocated strings for the console and the render path.
heapless = "0.8"

# Display stack (§6). The panel is a UC8179 7.5" V2, 800x480 mono.
#
# `epd2in13_v3` is NOT a display we have. The crate gates its shared `type_a`
# LUT constants behind those features and errors out without one of them:
#
#   error: One of feature "epd2in13_v2" and feature "epd2in13_v3" needs to be
#          enabled as a feature
#
# An upstream feature-gating bug, not a choice. The moisture project hit the
# same thing. Worth knowing before someone tidies it away and breaks the build.
epd-waveshare = { version = "0.6", default-features = false, features = [
    "graphics",
    "epd2in13_v3",
] }
embedded-graphics = "0.8"
# Needed directly, not just transitively: the inverted-BUSY adapter in
# `display.rs` implements `embedded_hal::digital::InputPin` itself, because that
# is the trait epd-waveshare consumes and the only place the inversion can be
# hidden from it.
embedded-hal = "1.0"
# Larger fonts than embedded-graphics' built-ins, which top out at 10x20 -- on
# an 800x480 panel meant to be read across a room that is not enough.
u8g2-fonts = "0.8"

[features]
default = []
# Compile light sleep out entirely. **A recovery build.**
#
# Light sleep powers down the USB Serial/JTAG PHY, so a board running it is
# reachable only in brief windows and neither the console nor espflash can be
# relied on. Recovering normally means ROM download mode, which needs GPIO9 held
# low at power-on -- and on a board whose BOOT button is under a shield, that
# may not be available at all.
#
# With this on, the device never sleeps and the port stays up permanently. Costs
# the battery savings; buys a board that can always be talked to.
no-light-sleep = []

# LittleFS, from the IDF component registry.
#
# LittleFS rather than SPIFFS, and the reason is specific to this board: it has
# a battery ON/OFF switch, so power is removed abruptly and often. SPIFFS is not
# power-loss resilient — a cut mid-write can corrupt the *filesystem*, taking
# the whole strike log with it rather than just the record being written.
# LittleFS is designed around exactly that failure and recovers to its last
# consistent state.
#
# `bindings_module` puts its bindings in their own module rather than merging
# them into the ESP-IDF ones, which avoids duplicating every IDF header the two
# share.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "^1.14" }
bindings_header = "littlefs_bindings.h"
bindings_module = "littlefs"

[build-dependencies]
embuild = "0.33"

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
opt-level = "s"
